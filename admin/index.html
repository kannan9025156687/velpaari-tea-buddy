<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Velpaari Tea Buddy — Admin</title>
<meta name="description" content="Staff dashboard for Velpaari Tea Buddy orders.">
<meta name="theme-color" content="#7b6cff">

<!--
  Theme design tokens, structural layout, and component styles.
  See docs/DESIGN_SYSTEM.md for the specification each file
  implements.
-->
<link rel="stylesheet" href="css/admin-theme.css">
<link rel="stylesheet" href="css/admin-layout.css">
<link rel="stylesheet" href="css/admin-components.css">

<!--
  Set the theme attribute before first paint, to avoid a flash of
  the wrong theme. Deliberately a classic (non-module) script so
  it runs synchronously, blocking, before anything renders.

  NOTE: 'teabuddy_theme' below must stay in sync with
  config/constants.js's STORAGE_KEYS.THEME — the admin app shares
  the same theme storage key as the customer app is NOT assumed
  (they are separate browser storage contexts on separate
  origins/sites), but the same literal key name is used for
  consistency if the two are ever viewed on the same origin.

  This only READS a previously-saved preference or the system
  preference — the actual dark/light toggle control is added by
  a later-phase module, not part of this foundation phase.
-->
<script>
  (function () {
    try {
      var saved = localStorage.getItem('teabuddy_theme');
      var theme = saved || (
        window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches
          ? 'light'
          : 'dark'
      );
      document.documentElement.setAttribute('data-theme', theme);
    } catch (e) {
      document.documentElement.setAttribute('data-theme', 'dark');
    }
  })();
</script>
</head>
<body>

<!--
  Application mount point. Empty by design in this foundation
  phase — Phase 6's router-driven pages (dashboardPage.js,
  ordersPage.js, orderDetailPage.js) render their content into
  this container once built.
-->
<div id="app"></div>

<script type="module" src="js/main.js"></script>
</body>
</html>
